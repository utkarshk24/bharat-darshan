name: Suggest a correction
description: Report a figure, name, date or text on Bharat Darshan that is wrong or out of date.
title: "Correction: "
labels: ["correction"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Every figure on the site must come from a published source, so please include a link to the
        **official** page that shows the correct value (government, legislature, census, survey or regulator).
        Corrections are reviewed before they are published; nothing is changed on the basis of an unsourced report.
  - type: input
    id: page
    attributes:
      label: Page
      description: The address of the page with the problem.
      placeholder: https://utkarshk24.github.io/bharat-darshan/en/states/maharashtra/
    validations:
      required: true
  - type: input
    id: item
    attributes:
      label: Which item?
      description: The figure, name or sentence that needs correcting, with its source and period if shown.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong?
    validations:
      required: true
  - type: textarea
    id: correct
    attributes:
      label: What should it say?
  - type: input
    id: source
    attributes:
      label: Official source
      description: A link to the page or document that supports the correction.
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language of the page
      options: [English, हिंदी, मराठी]
