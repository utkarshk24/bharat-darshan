# Builds the static site and publishes it to https://utkarshk24.github.io/bharat-darshan/
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate data
        run: npm run validate-data
      - name: Unit tests
        run: npm test
      - name: Static build for Pages
        env:
          # The repository name is the sub-path on github.io.
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
          PAGES_SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
        run: npm run build:pages
      - name: Internal link check
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run check:links
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
